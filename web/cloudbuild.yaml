steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - build
      - --tag
      - 'us-central1-docker.pkg.dev/trilink-web/trilink/web:latest'
      - --build-arg
      - 'NEXT_PUBLIC_API_BASE_URL=${_NEXT_PUBLIC_API_BASE_URL}'
      - --build-arg
      - 'NEXT_PUBLIC_CHAT_WS_URL=${_NEXT_PUBLIC_CHAT_WS_URL}'
      - --build-arg
      - 'NEXT_PUBLIC_CHAT_SOCKET_PATH=${_NEXT_PUBLIC_CHAT_SOCKET_PATH}'
      - --build-arg
      - 'NEXT_PUBLIC_AI_CORE_URL=${_NEXT_PUBLIC_AI_CORE_URL}'
      - --build-arg
      - 'NEXT_PUBLIC_AI_INTERNAL_KEY=${_NEXT_PUBLIC_AI_INTERNAL_KEY}'
      - --build-arg
      - 'NEXT_PUBLIC_AUTH_LOGIN_PATH=${_NEXT_PUBLIC_AUTH_LOGIN_PATH}'
      - --build-arg
      - 'NEXT_PUBLIC_AUTH_REFRESH_PATH=${_NEXT_PUBLIC_AUTH_REFRESH_PATH}'
      - --build-arg
      - 'NEXT_PUBLIC_FRONTEND_URL=${_NEXT_PUBLIC_FRONTEND_URL}'
      - .
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - push
      - 'us-central1-docker.pkg.dev/trilink-web/trilink/web:latest'

images:
  - 'us-central1-docker.pkg.dev/trilink-web/trilink/web:latest'

substitutions:
  _NEXT_PUBLIC_API_BASE_URL: 'https://api.trilink.live'
  _NEXT_PUBLIC_CHAT_WS_URL: 'https://api.trilink.live'
  _NEXT_PUBLIC_CHAT_SOCKET_PATH: '/socket.io'
  _NEXT_PUBLIC_AI_CORE_URL: 'https://trilink-ai-core-383699571084.us-central1.run.app'
  _NEXT_PUBLIC_AI_INTERNAL_KEY: 'trilink-internal-change-me'
  _NEXT_PUBLIC_AUTH_LOGIN_PATH: '/api/auth/login'
  _NEXT_PUBLIC_AUTH_REFRESH_PATH: '/api/auth/refresh'
  _NEXT_PUBLIC_FRONTEND_URL: 'https://trilink.live'

options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY
